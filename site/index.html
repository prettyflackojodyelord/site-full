<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Каталог книжного магазина Знание с поиском, фильтрами и сортировкой."><title>Каталог книг — Знание</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body data-page="catalog"><div id="site-header"></div><main id="main-content">
  <header class="page-hero"><div class="container"><div class="breadcrumbs"><a href="main.html">Главная</a><span>·</span><span aria-current="page">Каталог</span></div><p class="eyebrow">31 разная книга</p><h1>Каталог для вдумчивого выбора</h1><p>Фильтры применяются совместно. Годы в каталоге — годы первого издания произведений; рейтинги и цены демонстрационные.</p></div></header>
  <section class="section section--compact"><div class="container catalog-layout">
    <form class="filters" id="catalog-filters" aria-label="Фильтры каталога">
      <div class="filter-group"><span class="filter-group__title">Жанр</span><div class="check-list">
        <label class="check-label"><input type="radio" name="genre" value="" checked> Все книги</label><label class="check-label"><input type="radio" name="genre" value="russian-classics"> Русская классика</label><label class="check-label"><input type="radio" name="genre" value="world-classics"> Зарубежная классика</label><label class="check-label"><input type="radio" name="genre" value="science-fiction"> Научная фантастика</label><label class="check-label"><input type="radio" name="genre" value="dystopia"> Антиутопия</label><label class="check-label"><input type="radio" name="genre" value="fantasy"> Фэнтези</label><label class="check-label"><input type="radio" name="genre" value="detective"> Детектив</label>
      </div></div>
      <div class="filter-group"><span class="filter-group__title">Цена, ₽</span><div class="range-row"><input class="field" id="price-from" name="priceFrom" type="number" min="0" step="50" placeholder="От" aria-label="Цена от"><input class="field" id="price-to" name="priceTo" type="number" min="0" step="50" placeholder="До" aria-label="Цена до"></div></div>
      <div class="filter-group"><span class="filter-group__title">Первое издание</span><div class="range-row"><input class="field" id="year-from" name="yearFrom" type="number" min="1800" max="2026" placeholder="От" aria-label="Год от"><input class="field" id="year-to" name="yearTo" type="number" min="1800" max="2026" placeholder="До" aria-label="Год до"></div></div>
      <button class="button button--secondary" type="reset" data-reset-filters>Сбросить</button>
    </form>
    <div><div class="catalog-toolbar"><p id="catalog-count" class="muted" aria-live="polite">Загрузка каталога…</p><div class="catalog-toolbar__controls"><label for="catalog-sort">Сортировка</label><select class="select" id="catalog-sort"><option value="rating-desc">По рейтингу</option><option value="price-asc">Цена: по возрастанию</option><option value="price-desc">Цена: по убыванию</option><option value="year-desc">Сначала новые</option><option value="year-asc">Сначала ранние</option><option value="title-asc">По названию</option></select></div></div><div class="book-grid" id="catalog-grid"><div class="loading-skeleton"></div><div class="loading-skeleton"></div><div class="loading-skeleton"></div></div></div>
  </div></section>
</main><div id="site-footer"></div><script src="assets/js/books.js"></script><script src="assets/js/app.js"></script></body></html>

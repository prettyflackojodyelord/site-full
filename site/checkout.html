<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Демонстрационное оформление заказа."><title>Оформление заказа — Знание</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body data-page="cart"><div id="site-header"></div><main id="main-content"><header class="page-hero"><div class="container"><div class="breadcrumbs"><a href="main.html">Главная</a><span>·</span><a href="cart.html">Корзина</a><span>·</span><span aria-current="page">Оформление</span></div><p class="eyebrow">Демонстрационная форма</p><h1>Оформление заказа</h1><p>Форма валидируется, но не создаёт реальный заказ, не передаёт данные и не проводит оплату.</p></div></header><section class="section"><div class="container checkout-layout"><form class="form-card form-grid" data-demo-form="checkout" novalidate><h2>Получатель</h2><div class="field-row"><div class="form-group"><label for="checkout-name">Имя и фамилия</label><input class="field" id="checkout-name" name="name" type="text" autocomplete="name" required><span class="field-error" data-error-for="name"></span></div><div class="form-group"><label for="checkout-phone">Телефон</label><input class="field" id="checkout-phone" name="phone" type="tel" autocomplete="tel" required><span class="field-error" data-error-for="phone"></span></div></div><div class="form-group"><label for="checkout-email">Email</label><input class="field" id="checkout-email" name="email" type="email" autocomplete="email" required><span class="field-error" data-error-for="email"></span></div><h2>Доставка</h2><div class="form-group"><label for="checkout-address">Адрес</label><input class="field" id="checkout-address" name="address" type="text" autocomplete="street-address" required><span class="field-error" data-error-for="address"></span></div><div class="form-group"><label for="checkout-comment">Комментарий</label><textarea class="textarea" id="checkout-comment" name="comment" placeholder="Необязательно"></textarea></div><label class="check-label"><input name="consent" type="checkbox" required> Я понимаю, что заказ демонстрационный и данные не отправляются</label><span class="field-error" data-error-for="consent"></span><button class="button" id="checkout-submit" type="submit">Сформировать демо-заказ</button><div class="form-status" role="status" tabindex="-1"></div></form><aside class="summary-card" id="checkout-summary"></aside></div></section></main><div id="site-footer"></div><script src="assets/js/books.js"></script><script src="assets/js/app.js"></script></body></html>
